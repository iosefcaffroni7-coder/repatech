# Configuración para publicar el backend gratis en Render (render.com).
# En Render: New > Blueprint > elegir este repositorio. Render lee este archivo
# y solo pide los valores secretos (enlace de MongoDB y clave de Gemini).

services:
  - type: web
    name: repatech-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: ADMIN_USUARIO
        value: admin
      - key: ADMIN_CLAVE
        value: thesun
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODELO
        value: gemini-3.8-flash
