<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de administrador - RepaTech</title>
<meta name="robots" content="noindex">
<meta name="author" content="Iosef (The_Sun) - iosefcaffroni7@gmail.com">
<link rel="icon" type="image/svg+xml" href="imagenes/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<header class="encabezado">
  <div class="contenedor barra-nav">
    <a href="index.html" class="logo">
      <img src="imagenes/logo.svg" alt="Logo RepaTech" width="42">
      <span>Repa<b>Tech</b> <small class="etiqueta-admin">admin</small></span>
    </a>
    <button type="button" class="boton boton-secundario boton-chico oculto" id="botonSalir">Cerrar sesión</button>
  </div>
</header>

<main class="contenedor">

  <!-- Vista 1: inicio de sesión -->
  <section id="vistaLogin" class="caja-login">
    <p class="pre-titulo">solo personal</p>
    <h1>Entrar al panel</h1>
    <form id="formLogin" class="formulario-login">
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input type="text" id="usuario" autocomplete="username" required>
      </div>
      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" autocomplete="current-password" required>
      </div>
      <button type="submit" class="boton boton-primario">Entrar</button>
    </form>
    <p id="avisoLogin" class="aviso-formulario oculto" role="alert"></p>
    <a href="index.html" class="volver">← Volver a la página</a>
  </section>

  <!-- Vista 2: panel (se muestra después de iniciar sesión) -->
  <section id="vistaPanel" class="oculto">
    <div class="resumen">
      <div class="dato"><strong id="totalPendientes">0</strong><span>visitas pendientes</span></div>
      <div class="dato"><strong id="totalAtendidas">0</strong><span>visitas atendidas</span></div>
      <div class="dato"><strong id="totalResenas">0</strong><span>reseñas publicadas</span></div>
    </div>

    <div class="pestanas" role="tablist">
      <button type="button" class="chip activo" data-pestana="solicitudes" role="tab">Solicitudes de visita</button>
      <button type="button" class="chip" data-pestana="resenas" role="tab">Reseñas</button>
    </div>

    <div id="pestanaSolicitudes">
      <div class="filtros-admin">
        <label for="filtroEstado">Mostrar:</label>
        <select id="filtroEstado">
          <option value="todas">Todas</option>
          <option value="pendiente">Pendientes</option>
          <option value="atendida">Atendidas</option>
        </select>
      </div>
      <div id="listaSolicitudes" class="lista-admin" aria-live="polite"></div>
    </div>

    <div id="pestanaResenas" class="oculto">
      <div id="listaResenas" class="lista-admin" aria-live="polite"></div>
    </div>
  </section>

</main>

<footer class="pie-admin">
  RepaTech © 2026 · Desarrollado por <strong>Iosef (The_Sun)</strong> · iosefcaffroni7@gmail.com · 304 643 7285
</footer>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
